name: Database Backup

on:
  schedule:
    # Run at midnight UTC every day (0 0 * * *)
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allow manual triggering

jobs:
  backup:
    runs-on: self-hosted
    
    steps:
    - name: Create database backup
      run: |
        # Set backup directory and database path
        DB_PATH="/var/lib/garden/db/garden.db"
        BACKUP_DIR="/var/lib/garden/backups"
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        DATE=$(date +%Y%m%d)
        
        # Create backup directory if it doesn't exist
        mkdir -p "$BACKUP_DIR"
        
        if [ -f "$DB_PATH" ]; then
          echo "Creating database backup..."
          
          # Create timestamped backup
          cp "$DB_PATH" "${BACKUP_DIR}/garden_backup_${TIMESTAMP}.db"
          echo "Database backup created: garden_backup_${TIMESTAMP}.db"
          
          # Create a daily backup (overwrites previous daily backup)
          cp "$DB_PATH" "${BACKUP_DIR}/garden_daily_backup.db"
          echo "Daily backup updated: garden_daily_backup.db"
          
          # Cleanup old backups (keep last 14 days of timestamped backups)
          find "$BACKUP_DIR" -name "garden_backup_*.db" -type f -mtime +14 -delete
          echo "Cleaned up backups older than 14 days"
          
          # Display backup info
          echo "Backup completed successfully"
          echo "Backup size: $(du -h ${BACKUP_DIR}/garden_backup_${TIMESTAMP}.db | cut -f1)"
          echo "Available backups:"
          ls -la "$BACKUP_DIR"/garden_backup_*.db | tail -5
          
        else
          echo "ERROR: Database file not found at $DB_PATH"
          exit 1
        fi
        
    - name: Verify backup integrity
      run: |
        BACKUP_DIR="/var/lib/garden/backups"
        LATEST_BACKUP=$(ls -t "$BACKUP_DIR"/garden_backup_*.db | head -1)
        
        if [ -f "$LATEST_BACKUP" ]; then
          echo "Verifying backup integrity..."
          # Basic SQLite integrity check
          if command -v sqlite3 >/dev/null 2>&1; then
            if sqlite3 "$LATEST_BACKUP" "PRAGMA integrity_check;" | grep -q "ok"; then
              echo "Backup integrity check passed"
            else
              echo "ERROR: Backup integrity check failed"
              exit 1
            fi
          else
            echo "SQLite3 not available, skipping integrity check"
          fi
        else
          echo "ERROR: No backup found for verification"
          exit 1
        fi
        
    - name: Log backup completion
      run: |
        BACKUP_DIR="/var/lib/garden/backups"
        TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
        
        # Log backup completion
        echo "[$TIMESTAMP] Database backup completed successfully" >> "$BACKUP_DIR/backup.log"
        
        # Keep only last 100 log entries
        tail -100 "$BACKUP_DIR/backup.log" > "$BACKUP_DIR/backup.log.tmp" && mv "$BACKUP_DIR/backup.log.tmp" "$BACKUP_DIR/backup.log"
        
        echo "Backup process completed at $TIMESTAMP"
