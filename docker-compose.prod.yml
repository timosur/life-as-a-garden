version: '3.8'

services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: garden-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
      - rmapi-wrapper
    restart: unless-stopped
    volumes:
      # Override with production SSL config
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      # SSL certificates
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

  certbot:
    image: certbot/certbot
    container_name: garden-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $!; done;'"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: garden-backend
    expose:
      - "8000"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - FRONTEND_URL=https://garden.timosur.com/
      - RMAPI_SERVICE_URL=http://rmapi-wrapper:8001
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/input:/app/input
      - ./backend/output:/app/output
      - /var/lib/garden/db:/app/db
    restart: unless-stopped
    depends_on:
      - rmapi-wrapper
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 3600s
      timeout: 10s
      retries: 3
      start_period: 40s

  rmapi-wrapper:
    build:
      context: ./rmapi-wrapper
      dockerfile: Dockerfile
    container_name: garden-rmapi-wrapper
    expose:
      - "8001"
    volumes:
      - /root/.config/rmapi:/root/.config/rmapi
      - /root/rmapi:/tmp/rmapi
      - /tmp/rmapi-uploads:/tmp/rmapi-uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 3600s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./garden
      dockerfile: Dockerfile
    container_name: garden-frontend
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 3600s
      timeout: 10s
      retries: 3
      start_period: 10s

  scheduler:
    image: curlimages/curl:latest
    container_name: garden-scheduler
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - TZ=Europe/Berlin
    entrypoint: >
      sh -c "
      echo 'Installing supercronic...'
      && curl -fsSL https://github.com/aptible/supercronic/releases/download/v0.2.30/supercronic-linux-arm64 -o /tmp/supercronic
      && if [ ! -s /tmp/supercronic ]; then echo 'Download failed'; exit 1; fi
      && chmod +x /tmp/supercronic
      && echo '0 1 * * * curl -X POST http://backend:8000/api/garden/water' > /tmp/crontab
      && echo 'Starting scheduler...'
      && /tmp/supercronic /tmp/crontab
      "

networks:
  default:
    name: garden-network
