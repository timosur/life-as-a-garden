version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: garden-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - FRONTEND_URL=http://frontend:80/
      - RMAPI_SERVICE_URL=http://rmapi-wrapper:8001
    env_file:
      - ./backend/.env
    volumes:
      # Mount volumes for persistent data
      - ./backend/input:/app/input
      - ./backend/output:/app/output
      # Mount database directory for persistence
      - ./backend/db:/app/db
    restart: unless-stopped
    depends_on:
      - rmapi-wrapper
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  rmapi-wrapper:
    build:
      context: ./rmapi-wrapper
      dockerfile: Dockerfile
    container_name: garden-rmapi-wrapper
    ports:
      - "8001:8001"
    volumes:
      # Mount rmapi config and data directories
      - /root/.config/rmapi:/root/.config/rmapi
      - /root/rmapi:/tmp/rmapi
      # Mount temporary upload directory
      - /tmp/rmapi-uploads:/tmp/rmapi-uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/rmapi/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./garden
      dockerfile: Dockerfile
    container_name: garden-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  scheduler:
    image: curlimages/curl:latest
    container_name: garden-scheduler
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - TZ=Europe/Berlin  # Set timezone to CET
    entrypoint: >
      sh -c "
      echo 'Installing supercronic...'
      && curl -fsSL https://github.com/aptible/supercronic/releases/download/v0.2.30/supercronic-linux-arm64 -o /tmp/supercronic
      && if [ ! -s /tmp/supercronic ]; then echo 'Download failed'; exit 1; fi
      && chmod +x /tmp/supercronic
      && echo '0 1 * * * curl -X POST http://backend:8000/api/garden/water' > /tmp/crontab
      && echo 'Starting scheduler...'
      && /tmp/supercronic /tmp/crontab
      "

networks:
  default:
    name: garden-network
