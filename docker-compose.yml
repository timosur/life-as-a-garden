version: "3.8"

services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: garden-nginx
    ports:
      - "8899:80"
    depends_on:
      - backend
      - frontend
      - rmapi-wrapper
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: garden-postgres
    environment:
      - POSTGRES_USER=garden
      - POSTGRES_PASSWORD=garden
      - POSTGRES_DB=garden
    ports:
      - "5432:5432"
    volumes:
      - /var/lib/garden/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garden"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: garden-backend
    # Expose port on 8000
    expose:
      - "8000"
    ports:
      - "8000:8000" # Exposed for garden API access, needed for printing, bypassing the nginx auth
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - FRONTEND_URL=http://nginx:80
      - RMAPI_SERVICE_URL=http://rmapi-wrapper:8001
      - DATABASE_URL=postgresql://garden:garden@postgres:5432/garden
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/input:/app/input
      - ./backend/output:/app/output
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rmapi-wrapper:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 3600s
      timeout: 10s
      retries: 3
      start_period: 40s

  rmapi-wrapper:
    build:
      context: ./rmapi-wrapper
      dockerfile: Dockerfile
    container_name: garden-rmapi-wrapper
    # Port only exposed internally to nginx
    expose:
      - "8001"
    volumes:
      # Mount rmapi config directory
      - ${HOME}/.config/rmapi:/root/.config/rmapi
      # Mount temporary upload directory
      - /tmp/rmapi-uploads:/tmp/rmapi-uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 3600s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./garden
      dockerfile: Dockerfile
    container_name: garden-frontend
    # Port only exposed internally to nginx
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped
    # Simple health check for static frontend - just verify nginx is responding
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:80/"]
      interval: 3600s
      timeout: 10s
      retries: 3
      start_period: 10s

  scheduler:
    image: curlimages/curl:latest
    container_name: garden-scheduler
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - TZ=Europe/Berlin # Set timezone to CET
    entrypoint: >
      sh -c "
      echo 'Installing supercronic...'
      && curl -fsSL https://github.com/aptible/supercronic/releases/download/v0.2.30/supercronic-linux-arm64 -o /tmp/supercronic
      && if [ ! -s /tmp/supercronic ]; then echo 'Download failed'; exit 1; fi
      && chmod +x /tmp/supercronic
      && echo '0 1 * * * curl -X POST http://backend:8000/api/garden/water' > /tmp/crontab
      && echo 'Starting scheduler...'
      && /tmp/supercronic /tmp/crontab
      "

networks:
  default:
    name: garden-network
